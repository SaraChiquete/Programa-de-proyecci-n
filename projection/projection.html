<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Proyección</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;box-sizing:border-box;padding:4vw}
#box{box-sizing:border-box;padding:1.5vw 2.5vw;border-radius:1vw}
#text{white-space:pre-line}#ref{margin-top:1.5vw;font-size:.45em;opacity:.85}
</style></head><body><div id="stage"><div id="box"><div id="text"></div><div id="ref"></div></div></div>
<script>
const st=document.getElementById('stage'),bx=document.getElementById('box'),tx=document.getElementById('text'),rf=document.getElementById('ref');
let cur={mode:'black'};
function fit(){let z=(cur.style&&cur.style.size)||6;bx.style.fontSize=z+'vw';
  while(bx.scrollHeight>st.clientHeight*.92&&z>1.2){z-=.25;bx.style.fontSize=z+'vw';}}
function render(s){cur=s;st.style.visibility=s.mode==='black'?'hidden':'visible';if(s.mode==='black')return;
  const y=s.style||{};st.style.background=s.background||'#111';st.style.backgroundSize='cover';st.style.backgroundPosition='center';
  st.style.justifyContent=y.v||'center';bx.style.width='100%';bx.style.transform=`translateX(${y.h||0}%)`;
  bx.style.background=`rgba(0,0,0,${(y.box||0)/100})`;bx.style.color=y.color||'#fff';bx.style.fontFamily=y.font||'Georgia,serif';
  bx.style.fontWeight=y.bold?700:400;bx.style.textAlign=y.align||'center';bx.style.lineHeight=y.line||1.3;
  bx.style.textShadow=y.shadow?'0 .08em .25em rgba(0,0,0,.85)':'none';bx.style.webkitTextStroke=y.outline?'.03em #000':'0';
  bx.style.paintOrder='stroke fill';
  if(s.mode==='hidden'){bx.style.visibility='hidden';return}
  bx.style.visibility='visible';tx.textContent=s.text||'';rf.textContent=s.reference||'';fit();}
if(window.api)window.api.onState(render);else addEventListener('message',e=>render(e.data));
addEventListener('resize',()=>render(cur));
</script></body></html>
